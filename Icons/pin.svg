<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <defs>
    <linearGradient id="pinGlassBody" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="30%" stop-color="#E2E4EC" />
      <stop offset="70%" stop-color="#9CA3AF" />
      <stop offset="100%" stop-color="#6B7280" />
    </linearGradient>
    <linearGradient id="pinGlassRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95" />
      <stop offset="50%" stop-color="#D1D5DB" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#374151" stop-opacity="0.8" />
    </linearGradient>
    <linearGradient id="needleGlass" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E5E7EB" />
      <stop offset="50%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#9CA3AF" />
    </linearGradient>
    <filter id="glassDrop" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Top Rounded Cap / Head -->
  <rect x="14" y="6" width="20" height="6" rx="3" ry="3"
        fill="url(#pinGlassBody)"
        stroke="url(#pinGlassRim)"
        stroke-width="1.2"
        filter="url(#glassDrop)" />

  <!-- Pushpin Tapered Body & Collar -->
  <path d="M 18,12 L 18,20 C 18,23.5 13,26 13,29 L 35,29 C 35,26 30,23.5 30,20 L 30,12 Z"
        fill="url(#pinGlassBody)"
        stroke="url(#pinGlassRim)"
        stroke-width="1.2"
        stroke-linejoin="round"
        filter="url(#glassDrop)" />

  <!-- Center Metallic Needle -->
  <path d="M 22.5,29 L 22.5,41 C 22.5,41.8 23.2,42.5 24,42.5 C 24.8,42.5 25.5,41.8 25.5,41 L 25.5,29 Z"
        fill="url(#needleGlass)"
        stroke="url(#pinGlassRim)"
        stroke-width="0.8" />
</svg>

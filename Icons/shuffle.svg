<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <defs>
    <linearGradient id="shuffleGlassBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="35%" stop-color="#E2E4EC" />
      <stop offset="70%" stop-color="#A5ACB8" />
      <stop offset="100%" stop-color="#6B7280" />
    </linearGradient>
    <linearGradient id="shuffleGlassRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95" />
      <stop offset="50%" stop-color="#CBD5E1" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#374151" stop-opacity="0.8" />
    </linearGradient>
    <filter id="glassDrop" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Track 1: Bottom-Left to Top-Right with Arrow -->
  <path d="M 29,8 L 33,12 L 8,37.2 L 10.8,40 L 36,15 L 40,19 L 40,8 Z"
        fill="url(#shuffleGlassBody)"
        stroke="url(#shuffleGlassRim)"
        stroke-width="1.2"
        filter="url(#glassDrop)" />

  <!-- Track 2 (Upper Part): Top-Left segment -->
  <path d="M 21.2,18.4 L 10.8,8 L 8,10.8 L 18.4,21.2 Z"
        fill="url(#shuffleGlassBody)"
        stroke="url(#shuffleGlassRim)"
        stroke-width="1.2"
        filter="url(#glassDrop)" />

  <!-- Track 2 (Lower Part): Bottom-Right segment with Arrow -->
  <path d="M 29.6,26.8 L 26.8,29.6 L 33,36 L 29,40 L 40,40 L 40,29 L 36,33 Z"
        fill="url(#shuffleGlassBody)"
        stroke="url(#shuffleGlassRim)"
        stroke-width="1.2"
        filter="url(#glassDrop)" />
</svg>

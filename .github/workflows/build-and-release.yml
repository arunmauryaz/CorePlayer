name: Build and Release Cross-Platform Packages

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            target: win-x64
            archive_name: CorePlayer-${{ github.ref_name }}-win-x64.zip
            command: 7z a
          - os: ubuntu-latest
            target: linux-x64
            archive_name: CorePlayer-${{ github.ref_name }}-linux-x64.tar.gz
            command: tar -czvf
          - os: macos-latest
            target: osx-arm64
            archive_name: CorePlayer-${{ github.ref_name }}-osx-arm64.zip
            command: zip -r
          - os: macos-13
            target: osx-x64
            archive_name: CorePlayer-${{ github.ref_name }}-osx-x64.zip
            command: zip -r

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish ${{ matrix.target }}
        run: dotnet publish src/CorePlayer/CorePlayer.csproj -c Release -r ${{ matrix.target }} --self-contained false -o publish/${{ matrix.target }}

      - name: Package Windows
        if: matrix.os == 'windows-latest'
        run: |
          Compress-Archive -Path "publish/${{ matrix.target }}/*" -DestinationPath "${{ matrix.archive_name }}"

      - name: Package Linux
        if: matrix.os == 'ubuntu-latest'
        run: |
          tar -czvf "${{ matrix.archive_name }}" -C "publish/${{ matrix.target }}" .

      - name: Package macOS
        if: runner.os == 'macOS'
        run: |
          cd publish/${{ matrix.target }} && zip -r "../../${{ matrix.archive_name }}" .

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: ${{ matrix.archive_name }}

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          draft: false
          prerelease: false
          generate_release_notes: true

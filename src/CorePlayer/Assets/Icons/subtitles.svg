<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <defs>
    <linearGradient id="liquidGlassBody" x1="15%" y1="10%" x2="85%" y2="90%">
      <stop offset="0%" stop-color="#9C9CA2" />
      <stop offset="35%" stop-color="#73737A" />
      <stop offset="70%" stop-color="#55555C" />
      <stop offset="100%" stop-color="#3C3C42" />
    </linearGradient>
    <linearGradient id="liquidGlassRim" x1="20%" y1="5%" x2="80%" y2="95%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95" />
      <stop offset="30%" stop-color="#D0D0D8" stop-opacity="0.75" />
      <stop offset="60%" stop-color="#606068" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#24242A" stop-opacity="0.9" />
    </linearGradient>
    <filter id="glassGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000000" flood-opacity="0.55" />
    </filter>
  </defs>

  <!-- CC Card Outer -->
  <rect x="7" y="11" width="34" height="26" rx="6" ry="6"
        fill="url(#liquidGlassBody)"
        stroke="url(#liquidGlassRim)"
        stroke-width="1.6"
        filter="url(#glassGlow)" />

  <!-- Left 'C' Pill Arc -->
  <path d="M19 19 C15 19 14 21.5 14 24 C14 26.5 15 29 19 29"
        fill="none"
        stroke="#FFFFFF"
        stroke-width="2.6"
        stroke-linecap="round" />

  <!-- Right 'C' Pill Arc -->
  <path d="M30 19 C26 19 25 21.5 25 24 C25 26.5 26 29 30 29"
        fill="none"
        stroke="#FFFFFF"
        stroke-width="2.6"
        stroke-linecap="round" />
</svg>
